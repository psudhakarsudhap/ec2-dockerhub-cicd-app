name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/ec2-dockerhub-cicd-app:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/ec2-dockerhub-cicd-app:latest

      - name: Deploy Docker container
        run: |
          docker stop ec2-dockerhub-cicd-app || true
          docker rm ec2-dockerhub-cicd-app || true
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/ec2-dockerhub-cicd-app:latest
          docker run -d --name ec2-dockerhub-cicd-app -p 5000:5000 ${{ secrets.DOCKER_HUB_USERNAME }}/ec2-dockerhub-cicd-app:latest