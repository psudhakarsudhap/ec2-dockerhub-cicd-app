name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Build Docker image
        run: docker build -t ec2-dockerhub-cicd-app .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/ec2-dockerhub-cicd-app .

      - name: Push Docker image to Docker Hub
        run:  docker push ${{ secrets.DOCKER_HUB_USERNAME }}/ec2-dockerhub-cicd-app:latest
      
      - name: SSH to EC2 and deploy Docker container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker stop ec2-dockerhub-cicd-app || true
            docker rm ec2-dockerhub-cicd-app || true
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/ec2-dockerhub-cicd-app:latest
            docker run -d --name ec2-dockerhub-cicd-app -p 5000:5000 ${{ secrets.DOCKER_HUB_USERNAME }}/ec2-dockerhub-cicd-app:latest